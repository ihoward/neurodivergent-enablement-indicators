id: NDI-g4e5z4
normalized_name: "bias mitigation safeguards exist in evaluation"

title: Evaluation processes include structural checks to reduce evaluator bias

description: |
  The organisation has established structural mechanisms specifically designed to reduce
  the influence of evaluator bias in performance assessments. These include blind or
  anonymised review elements where applicable, demographic outcome analysis of evaluation
  results to identify systematic disparities, and evaluator training specifically addressing
  bias in assessment. These mechanisms are distinct from general process structure: they
  target the risk that evaluators apply different standards to employees based on how those
  employees present, communicate, or are perceived, rather than on the quality of their work.

evidence_categories:
  - inferred
  - declared
  - validated

notes: |
  ND rationale: Neurodivergent employees are disproportionately subject to evaluation bias
  when processes rely on evaluator intuition or unstated norms. Structural safeguards
  provide a floor of objectivity that benefits all employees but is especially protective
  for those who deviate from behavioral majorities.
