id: NDI-ow2t74
normalized_name: "priority authority is explicitly defined"

title: Priorities are set through a defined process and communicated explicitly to employees

description: |
  The organisation maintains documented definitions of who holds authority to set, change,
  and arbitrate competing priorities at each level. When priority conflicts arise, the
  resolution pathway — including who decides and on what basis — is known without requiring
  informal navigation or relationship inference. Priorities are communicated explicitly to
  employees: employees should know which work takes precedence, when responses are expected,
  and whether a new request changes existing priorities.

  An important distinction applies: this indicator concerns whether the organisation has
  a governance mechanism for priority conflicts — not whether priorities ever change. Some
  priority change is expected in dynamic organisations. The absence of a mechanism for
  resolving conflicts predictably is the failure mode this indicator addresses.

evidence_categories:
  - inferred
  - declared
  - validated

notes: |
  ND rationale: Priority conflicts that must be resolved through informal negotiation or
  political positioning create high cognitive and emotional load. Employees who cannot
  rely on reading implicit signals to navigate priority disputes are left with either
  paralysis or the risk of incorrect independent prioritization.
