id: NDI-yatlql
normalized_name: "hiring patterns avoid bias toward sameness"

title: Hiring practices do not systematically screen out candidates for behavioural or stylistic differences

description: |
  The organisation's hiring practices, job descriptions, and screening processes do not
  systematically favour candidates who match a narrow behavioural or stylistic profile.
  This indicator addresses the hiring process specifically — job descriptions, screening
  criteria, and interview practices — rather than culture messaging, which is addressed
  in NDI-g7i2ad.

  Observable signals of bias toward sameness include job description language emphasising
  personality traits, social style, or interpersonal characteristics as primary selection
  criteria; terms such as "rockstar," "ninja," "culture champion," or "passionate" used
  as primary descriptors without output-based role definitions; and homogeneous leadership
  representation suggesting that hiring consistently converges on a narrow profile.

  Structured interviewing — using consistent, criteria-based questions anchored to
  observable outputs rather than unstructured conversation — is a positive design signal
  that reduces the opportunity for social style bias to influence hiring decisions.

evidence_categories:
  - inferred

notes: |
  ND rationale: Implicit hiring bias toward behavioral conformance functions as a structural
  filter against neurodivergent candidates. Even without explicit ND discrimination, job
  descriptions that emphasize traits associated with neurotypical presentation create a
  pipeline that systematically excludes neurodivergent talent.
