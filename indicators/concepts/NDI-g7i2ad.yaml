id: NDI-g7i2ad
normalized_name: "culture messaging avoids narrow conformity culture fit conformity boasting"

title: Culture messaging avoids narrow conformity signalling and culture-fit boasting

description: |
  The organisation's public culture communications — including careers pages, employer
  branding materials, leadership messaging, and hiring collateral — do not prominently
  emphasise narrow behavioural conformity, intense social cohesion, or "culture fit" as
  a filtering criterion. This applies equally to internal leadership messaging directed
  at existing employees: signals that conformity to one behavioural style is expected
  affect retention as well as recruitment.

  "Culture add" language should be treated with similar caution. Where "culture add" is
  used as a rebranding of culture fit — retaining the same filtering function while
  appearing more inclusive — it signals the same underlying conformity pressure.

  Communications do not signal that behavioural uniformity or social style alignment is
  a prerequisite for success or belonging within the organisation.

evidence_categories:
  - inferred

notes: |
  ND rationale: Prominent culture-fit messaging signals to neurodivergent applicants and
  employees that behavioral conformity is valued over output. Phrases emphasizing "we're
  a family," "high energy," "collaborative to the core," or "culture add" used as a
  fig-leaf for style filtering are detectable public signals of potential ND exclusion.
