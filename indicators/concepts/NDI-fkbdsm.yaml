id: NDI-fkbdsm
normalized_name: "procedural fairness in investigations"

title: Investigations and disciplinary processes demonstrate procedural fairness

description: |
  The organisation's processes for handling grievances, complaints, and disciplinary
  matters follow documented, consistent procedures. Affected parties are informed of
  the process, have a meaningful opportunity to respond, and receive written outcomes
  that are proportionate to the circumstances. Decisions are made by an impartial
  decision-maker. Procedural steps are not abbreviated or applied inconsistently.

  Many neurodivergent employees have a heightened sensitivity to perceived unfairness —
  sometimes described as justice sensitivity. For these employees, procedural clarity
  and consistency are not merely good governance: they are a meaningful environmental
  factor. Opaque, inconsistent, or apparently arbitrary processes are disproportionately
  destabilising.

