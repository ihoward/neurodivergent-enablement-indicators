id: NDI-eohpdo
normalized_name: "manager changes treated as major environment change"

title: Manager transitions are treated as significant environmental changes

description: |
  The organisation recognises that a change in direct manager is a substantial disruption
  to the working environment — equivalent in impact to a significant physical or structural
  change. Manager transitions represent the human dimension of change management: they
  alter the relationship through which work is assigned, evaluated, and supported. As with
  other material changes, employees should be informed of what is changing, why, the
  timeline, and what to expect during the transition period.

  Transition processes include documented handoffs, structured onboarding between the
  employee and new manager, and allowance for adjustment periods. High manager turnover
  rates may themselves indicate a structural problem — not only a transition management
  challenge. Where manager changes are frequent, this may signal instability in the
  management layer rather than a series of isolated events.

