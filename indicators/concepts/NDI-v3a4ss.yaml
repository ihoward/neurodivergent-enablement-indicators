id: NDI-v3a4ss
normalized_name: "avoid excessive 360 multirater review processes where subjectivity dominates"

title: Peer and multi-rater review processes are structured and anchored to observable outputs

description: |
  Where the organisation uses 360-degree or multi-rater review processes, the criteria
  evaluated are structured and anchored to observable behaviours and work outputs rather
  than stylistic, relational, or subjective qualities. A meaningful distinction applies
  between 360 processes used for development — which carry lower risk — and those used
  for formal rating, ranking, or promotion decisions, where unstructured criteria amplify
  the influence of social style and interpersonal preference. The latter require structured
  criteria with observable anchors to reduce the risk of systematic disadvantage for
  employees whose communication or presentation style differs from the evaluator's implicit
  norm.

evidence_categories:
  - inferred
  - declared

notes: |
  ND rationale: 360-degree processes amplify bias against employees who communicate or
  present differently. Peers and stakeholders who value style conformance over output
  quality may systematically disadvantage neurodivergent employees. Unstructured 360
  criteria also create high administrative and emotional processing load.
