id: NDI-vfm7gb
normalized_name: "reliance on indicators grounded in proper methods"

title: HR assessment tools are validated before use in consequential decisions

description: |
  The organisation bases internal people-related assessments, indicators, and benchmarks
  on measures with documented methodological validity — including defined measurement
  procedures, reliable operationalisation, and awareness of limitations. Unvalidated
  assessment instruments are not used in consequential HR or evaluation contexts —
  including hiring, promotion, or team composition decisions. MBTI, DISC, and similar
  frameworks lack the peer-reviewed validity evidence required for consequential use;
  their presence in hiring or performance decisions is a relevant negative signal.

  A useful distinction applies: this indicator targets consequential use of unvalidated
  tools, not their existence in optional development contexts. An organisation may use
  such instruments for self-reflection or team discussion without this indicator being
  triggered — the concern is their use as inputs to decisions affecting employees' careers.

evidence_categories:
  - inferred
  - declared

notes: |
  ND rationale: Organizations that use poorly-grounded assessments — including unvalidated
  personality frameworks, cultural "fit" scores, or subjective competency ratings — create
  evaluation environments where the measurement instrument itself is a source of bias.
  Methodological soundness is a precondition for fair evaluation of neurodivergent employees.
