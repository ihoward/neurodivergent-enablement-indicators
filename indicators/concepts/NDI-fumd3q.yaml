id: NDI-fumd3q
normalized_name: "reduce subjectivity in evaluations"

title: Performance evaluations are structured, evidence-based, and provide actionable feedback

description: |
  The organisation's performance evaluation system uses documented criteria that are known
  to employees before their review occurs. Employees should not have to infer how their
  work will be evaluated from culture, personal impression, or past observation. Feedback
  should be specific, proportionate to the magnitude of the performance event, and grounded
  in observable actions and outcomes. Feedback should explain what happened, what effect it
  had, and what different action or outcome is expected. Evaluation results are reviewed
  for consistency across assessors to reduce idiosyncratic variance.

evidence_categories:
  - inferred
  - declared
  - validated

notes: |
  ND rationale: Subjective evaluations are particularly susceptible to bias against employees
  whose communication style, social behavior, or presentation differs from the evaluator's
  implicit norm. Structuring evaluations protects employees who are strong performers but
  poor conformists.
