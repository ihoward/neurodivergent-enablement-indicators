id: NDI-mubms7
normalized_name: "documentation requirements scale proportionally to risk"

title: Approval and documentation burdens are matched to the risk and responsibility involved

description: |
  The organisation applies documentation and approval burdens in proportion to the actual
  risk, value, and role relevance of the action being taken. Low-risk, low-value items
  performed by employees whose core role is unrelated to the process should not require
  the same compliance overhead as high-risk decisions made by responsible specialists.
  Where documentation requirements do not reflect actual risk or role, this represents
  a poor design outcome rather than a neutral default.

evidence_categories:
  - inferred
  - declared
  - validated

notes: |
  ND rationale: Uniform high documentation burdens regardless of risk penalize employees
  who have difficulty sustaining multi-step compliance routines. Risk-proportionate design
  ensures that the heaviest processes apply only where the cost-benefit ratio justifies them.
