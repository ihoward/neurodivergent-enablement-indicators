id: NDI-eohpdo-v1
concept_id: NDI-eohpdo

criteria:
  inferred: |
    Look for employee reviews referencing manager changes as disruptive or
    poorly handled. Conversely, reviews that note structured transitions or
    continuity of support through management changes are positive signals.
    High manager turnover rates disclosed in ESG or culture reports may
    indicate structural instability rather than a series of isolated transitions.
    Where manager turnover is frequent, the structural cause should be examined.

  declared: |
    The organisation publicly describes a manager transition process that
    includes structured handoff, time for relationship development, and
    documented context transfer. The organisation communicates to affected
    employees what is changing, why, the timeline, and what to expect during
    the transition period. This may appear in employee handbook sections,
    manager training materials made public, or HR policy documents.

  validated: |
    The organisation submits documentation of its manager transition protocol
    to an accredited verifier who confirms the protocol includes: (1) a
    structured handoff document, (2) a defined onboarding period with the new
    manager, (3) employee-initiated check-ins during the transition period, and
    (4) a communication template that covers what is changing, why, the timeline,
    and what to expect.

citations:
  supporting:
    - >
      Doyle, N. (2020). Neurodiversity at work: A biopsychosocial model and the
      impact on working adults. British Medical Bulletin, 135(1), 108–125.
