id: NDI-2cdbgj-v1
concept_id: NDI-2cdbgj

criteria:
  inferred: |
    Look for employee reviews on platforms such as Glassdoor or Blind that
    reference administrative burden, confusing expense or approval processes,
    or difficulty navigating internal systems. Job descriptions referencing
    proficiency with internal tooling may indicate process complexity imposed
    on non-specialist employees. Reviews describing specialist teams handling
    corrections, validation, or normalisation of employee-submitted data are
    positive signals.

  declared: |
    The organisation publicly describes administrative processes in which
    specialist teams — finance, HR, procurement, compliance — bear primary
    responsibility for complexity. Descriptions of simplified employee-facing
    entry points, specialist-side validation, or procurement commitments that
    consider employee input burden satisfy this criterion.

  validated: |
    The organisation submits process documentation to an accredited verifier
    demonstrating that administrative processes are designed so specialist
    functions bear primary complexity, employee-facing steps are minimised,
    and software or procurement choices are evaluated for burden on the
    inputter, not just the specialist consumer.

citations:
  supporting:
    - >
      Doyle, N. (2020). Neurodiversity at work: A biopsychosocial model and the
      impact on working adults. British Medical Bulletin, 135(1), 108–125.
      https://doi.org/10.1093/bmb/ldaa021
  dissenting: []

